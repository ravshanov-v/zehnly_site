<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zehnly — bilim va zakovat platformasi: o'quv maskanlari, testlar va shaxsiy statistika bir joyda."
    />
    <title>Zehnly — Bilim va zakovat platformasi</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('zehnly-theme')
          const dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch {
          // localStorage mavjud bo'lmasa standart rejim ishlatiladi
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
