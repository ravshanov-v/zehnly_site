<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="Zehnly — bilim uchun yangi infratuzilma. Interaktiv zakovat arenasi, o'quv maskanlari katalogi va o'sish analitikasi bitta tezkor tizimda."
    />
    <meta property="og:title" content="Zehnly — Bilim infratuzilmasi" />
    <meta
      property="og:description"
      content="2 154 savol, 30 soniyalik interaktiv arena va o'sish analitikasi. Bilimni o'lchanadigan natijaga aylantiring."
    />
    <title>Zehnly — Bilim infratuzilmasi</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('zehnly-theme')
          const dark = saved ? saved === 'dark' : true
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
          const forced = new URLSearchParams(window.location.search).get('season')
          const month = new Date().getMonth() + 1
          const season =
            forced === 'autumn' || forced === 'independence'
              ? 'autumn'
              : forced === 'spring' || forced === 'navruz'
                ? 'spring'
                : forced === 'summer'
                  ? 'summer'
                  : forced === 'winter' || forced === 'newyear'
                    ? 'winter'
                    : month === 12 || month <= 2
                      ? 'winter'
                      : month <= 5
                        ? 'spring'
                        : month <= 8
                          ? 'summer'
                          : 'autumn'
          document.documentElement.dataset.season = season

          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            const autumn = season === 'autumn'
            meta.setAttribute(
              'content',
              dark ? (autumn ? '#0e0905' : '#05060a') : autumn ? '#f7f2e8' : '#f4f5f8'
            )
          }
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
